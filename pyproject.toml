[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartinstall-agent"
version = "0.1.0"
description = "SmartInstall AI — Installation Agent Foundation (Phase 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "structlog>=24.1,<25",
    "platformdirs>=4.2,<5",
    "psutil>=5.9,<7",
    'pywin32>=306; sys_platform == "win32"',
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pytest-cov>=5.0,<6"]
desktop = [
    "PySide6>=6.6,<7",
    "ollama",
    "langchain",
    "langchain-community",
    "langchain-chroma",
    "langchain-ollama",
    "chromadb",
]

[project.scripts]
smartinstall = "smartinstall.__main__:main"
smartinstall-desktop = "smartinstall.ui.main:main"
failure-harness = "failure_harness.run_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["smartinstall"]
